<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alice turn · Sequence</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #e7eaee;
      --color-ink:    #16181c;
      --color-muted:  #5a616b;
      --color-accent: #c41e3a;
      --font-sans:    "Geist", system-ui, sans-serif;
      --font-serif:   "Instrument Serif", serif;
      --font-mono:    "Geist Mono", ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      padding: 0.5rem 0.25rem 0;
    }
    .frame { width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: 1.5rem;
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      margin-bottom: 0.75rem;
    }
    html, body { height: 100%; }
    svg {
      width: 100%;
      height: auto;
      display: block;
    }
    body.embed {
      padding: 0;
      overflow: hidden;
    }
    body.embed .eyebrow, body.embed h1 { display: none; }
    body.embed .frame { height: 100%; }
    body.embed svg {
      height: 100%;
      max-height: 100%;
    }
  </style>
</head>
<body>
  <script>if (new URLSearchParams(location.search).has("embed")) document.body.classList.add("embed");</script>
  <div class="frame">
    <p class="eyebrow">Sequence · Diagram Design</p>
    <h1>Open desk. Sign in at Scalekit. JWT names Alice.</h1>
    <svg viewBox="0 0 1000 700" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="alice-turn-title alice-turn-desc">
      <title id="alice-turn-title">Open desk. Sign in at Scalekit. JWT names Alice.</title>
      <desc id="alice-turn-desc">The desk sends Alice to Scalekit. She signs in. Scalekit returns a JWT. The desk reads the JWT to know she is Alice. Later Scalekit calls Slack as Alice. Cognee only recalls memory.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#5a616b"/>
        </marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#c41e3a"/>
        </marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#243044"/>
        </marker>
        <marker id="arrow-sk" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#1f6b45"/>
        </marker>
      </defs>
      <rect width="100%" height="100%" fill="#e7eaee"/>

      <!-- Lifelines: Alice 80 · Desk 280 · Cognee 500 · Scalekit 700 · Slack 900 -->
      <line x1="80" y1="112" x2="80" y2="616" stroke="rgba(22,24,28,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="280" y1="112" x2="280" y2="616" stroke="rgba(22,24,28,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="500" y1="112" x2="500" y2="616" stroke="rgba(22,24,28,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="700" y1="112" x2="700" y2="616" stroke="rgba(22,24,28,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="900" y1="112" x2="900" y2="616" stroke="rgba(22,24,28,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

      <!-- Activation bars. Desk pauses while Alice is on Scalekit. -->
      <rect x="276" y="160" width="8" height="40" fill="rgba(22,24,28,0.06)" stroke="#5a616b" stroke-width="0.8"/>
      <rect x="276" y="256" width="8" height="324" fill="rgba(22,24,28,0.06)" stroke="#5a616b" stroke-width="0.8"/>
      <rect x="76" y="224" width="8" height="32" fill="rgba(22,24,28,0.06)" stroke="#5a616b" stroke-width="0.8"/>
      <rect x="496" y="312" width="8" height="40" fill="rgba(22,24,28,0.06)" stroke="#5a616b" stroke-width="0.8"/>
      <rect x="696" y="224" width="8" height="40" fill="rgba(31,107,69,0.12)" stroke="#1f6b45" stroke-width="0.8"/>
      <rect x="696" y="508" width="8" height="48" fill="rgba(31,107,69,0.12)" stroke="#1f6b45" stroke-width="0.8"/>
      <rect x="896" y="540" width="8" height="40" fill="rgba(22,24,28,0.06)" stroke="#5a616b" stroke-width="0.8"/>

      <!-- M1 Alice → Desk -->
      <line x1="80" y1="160" x2="276" y2="160" stroke="#243044" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <rect x="128" y="132" width="80" height="16" rx="2" fill="#e7eaee"/>
      <text x="168" y="150" fill="#243044" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">OPEN DESK</text>

      <!-- M2 Desk → Alice: redirect to Scalekit -->
      <line x1="276" y1="192" x2="88" y2="192" stroke="#1f6b45" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arrow-sk)"/>
      <rect x="112" y="164" width="112" height="16" rx="2" fill="#e7eaee"/>
      <text x="168" y="182" fill="#1f6b45" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">GO SCALEKIT</text>

      <!-- M3 Alice → Scalekit hosted login -->
      <line x1="84" y1="224" x2="696" y2="224" stroke="#1f6b45" stroke-width="1.4" marker-end="url(#arrow-sk)"/>
      <rect x="152" y="196" width="80" height="16" rx="2" fill="#e7eaee"/>
      <text x="192" y="214" fill="#1f6b45" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SIGN IN</text>

      <!-- M4 Scalekit → Desk JWT -->
      <line x1="696" y1="256" x2="288" y2="256" stroke="#1f6b45" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arrow-sk)"/>
      <rect x="520" y="228" width="80" height="16" rx="2" fill="#e7eaee"/>
      <text x="560" y="246" fill="#1f6b45" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">JWT ALICE</text>
      <text x="700" y="288" fill="#1f6b45" font-size="16" font-family="'Instrument Serif', serif" font-style="italic" text-anchor="middle">Scalekit issues the JWT.</text>

      <!-- M5 Alice → Desk ask -->
      <line x1="80" y1="304" x2="276" y2="304" stroke="#5a616b" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="120" y="276" width="96" height="16" rx="2" fill="#e7eaee"/>
      <text x="168" y="294" fill="#5a616b" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ASK ISSUE</text>

      <!-- M6 Desk → Cognee recall -->
      <line x1="284" y1="328" x2="496" y2="328" stroke="#243044" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <rect x="328" y="300" width="112" height="16" rx="2" fill="#e7eaee"/>
      <text x="384" y="318" fill="#243044" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RECALL DATASET</text>

      <!-- M6 Cognee → Desk memory -->
      <line x1="496" y1="356" x2="288" y2="356" stroke="#c41e3a" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arrow-accent)"/>
      <rect x="336" y="328" width="96" height="16" rx="2" fill="#e7eaee"/>
      <text x="384" y="346" fill="#c41e3a" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">MEMORY HIT</text>

      <!-- ALT frame: answer vs action -->
      <rect x="40" y="368" width="936" height="240" rx="4" fill="rgba(22,24,28,0.02)" stroke="rgba(22,24,28,0.22)" stroke-width="1"/>
      <rect x="40" y="360" width="40" height="16" rx="2" fill="#e7eaee" stroke="rgba(22,24,28,0.22)" stroke-width="1"/>
      <text x="60" y="380" fill="#5a616b" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">ALT</text>
      <text x="52" y="400" fill="#5a616b" font-size="12" font-family="'Geist Mono', monospace" letter-spacing="0.04em">[answer is enough]</text>

      <!-- M6 Desk → Alice reply -->
      <line x1="276" y1="424" x2="88" y2="424" stroke="#5a616b" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <rect x="132" y="396" width="80" height="16" rx="2" fill="#e7eaee"/>
      <text x="172" y="414" fill="#5a616b" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">REPLY ALICE</text>

      <line x1="48" y1="456" x2="968" y2="456" stroke="rgba(22,24,28,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="52" y="476" fill="#5a616b" font-size="12" font-family="'Geist Mono', monospace" letter-spacing="0.04em">[alice needs an action]</text>

      <!-- M7 Desk → Scalekit tool call -->
      <line x1="284" y1="508" x2="696" y2="508" stroke="#1f6b45" stroke-width="1.4" marker-end="url(#arrow-sk)"/>
      <rect x="420" y="480" width="112" height="16" rx="2" fill="#e7eaee"/>
      <text x="476" y="498" fill="#1f6b45" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SLACK TOOL</text>

      <!-- M8 Scalekit → Slack -->
      <line x1="704" y1="540" x2="896" y2="540" stroke="#1f6b45" stroke-width="1.4" marker-end="url(#arrow-sk)"/>
      <rect x="736" y="512" width="112" height="16" rx="2" fill="#e7eaee"/>
      <text x="792" y="530" fill="#1f6b45" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">POST AS ALICE</text>
      <text x="800" y="492" fill="#1f6b45" font-size="16" font-family="'Instrument Serif', serif" font-style="italic" text-anchor="middle">Scalekit holds the Slack token.</text>

      <!-- M9 Slack → Alice -->
      <line x1="896" y1="572" x2="88" y2="572" stroke="#5a616b" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <rect x="448" y="544" width="80" height="16" rx="2" fill="#e7eaee"/>
      <text x="488" y="562" fill="#5a616b" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">DONE AS ALICE</text>

      <!-- Actor boxes (after arrows) -->
      <rect x="20" y="40" width="120" height="56" rx="6" fill="#e7eaee"/>
      <rect x="20" y="40" width="120" height="56" rx="6" fill="rgba(90,97,107,0.10)" stroke="#5a616b" stroke-width="1"/>
      <rect x="28" y="48" width="36" height="12" rx="2" fill="transparent" stroke="rgba(90,97,107,0.40)" stroke-width="0.8"/>
      <text x="46" y="57" fill="#5a616b" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">USER</text>
      <text x="80" y="80" fill="#16181c" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Alice</text>

      <rect x="220" y="40" width="120" height="56" rx="6" fill="#e7eaee"/>
      <rect x="220" y="40" width="120" height="56" rx="6" fill="#ffffff" stroke="#16181c" stroke-width="1"/>
      <rect x="228" y="48" width="36" height="12" rx="2" fill="transparent" stroke="rgba(22,24,28,0.30)" stroke-width="0.8"/>
      <text x="246" y="57" fill="#5a616b" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">HOST</text>
      <text x="280" y="80" fill="#16181c" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Issue desk</text>

      <rect x="440" y="40" width="120" height="56" rx="6" fill="#e7eaee"/>
      <rect x="440" y="40" width="120" height="56" rx="6" fill="rgba(196,30,58,0.08)" stroke="#c41e3a" stroke-width="1"/>
      <rect x="448" y="48" width="40" height="12" rx="2" fill="transparent" stroke="rgba(196,30,58,0.50)" stroke-width="0.8"/>
      <text x="468" y="57" fill="#c41e3a" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MEM</text>
      <text x="500" y="80" fill="#16181c" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Cognee</text>

      <rect x="640" y="40" width="120" height="56" rx="6" fill="#e7eaee"/>
      <rect x="640" y="40" width="120" height="56" rx="6" fill="rgba(31,107,69,0.10)" stroke="#1f6b45" stroke-width="1"/>
      <rect x="648" y="48" width="36" height="12" rx="2" fill="transparent" stroke="rgba(31,107,69,0.50)" stroke-width="0.8"/>
      <text x="666" y="57" fill="#1f6b45" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">AUTH</text>
      <text x="700" y="80" fill="#16181c" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Scalekit</text>

      <rect x="840" y="40" width="120" height="56" rx="6" fill="#e7eaee"/>
      <rect x="840" y="40" width="120" height="56" rx="6" fill="rgba(22,24,28,0.03)" stroke="rgba(22,24,28,0.30)" stroke-width="1"/>
      <rect x="848" y="48" width="40" height="12" rx="2" fill="transparent" stroke="rgba(22,24,28,0.30)" stroke-width="0.8"/>
      <text x="868" y="57" fill="#5a616b" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXT</text>
      <text x="900" y="80" fill="#16181c" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Slack</text>

      <!-- Legend -->
      <line x1="40" y1="644" x2="960" y2="644" stroke="rgba(22,24,28,0.10)" stroke-width="0.8"/>
      <text x="40" y="664" fill="#5a616b" font-size="12" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
      <rect x="120" y="656" width="12" height="12" rx="2" fill="rgba(90,97,107,0.10)" stroke="#5a616b" stroke-width="1"/>
      <text x="140" y="666" fill="#5a616b" font-size="12" font-family="'Geist Mono', monospace">ALICE</text>
      <rect x="200" y="656" width="12" height="12" rx="2" fill="#ffffff" stroke="#16181c" stroke-width="1"/>
      <text x="220" y="666" fill="#5a616b" font-size="12" font-family="'Geist Mono', monospace">DESK</text>
      <rect x="280" y="656" width="12" height="12" rx="2" fill="rgba(31,107,69,0.10)" stroke="#1f6b45" stroke-width="1"/>
      <text x="300" y="666" fill="#5a616b" font-size="12" font-family="'Geist Mono', monospace">SCALEKIT</text>
      <rect x="400" y="656" width="12" height="12" rx="2" fill="rgba(196,30,58,0.08)" stroke="#c41e3a" stroke-width="1"/>
      <text x="420" y="666" fill="#5a616b" font-size="12" font-family="'Geist Mono', monospace">COGNEE</text>
      <line x1="500" y1="662" x2="532" y2="662" stroke="#1f6b45" stroke-width="1.4"/>
      <text x="540" y="666" fill="#5a616b" font-size="12" font-family="'Geist Mono', monospace">SCALEKIT STEP</text>
      <line x1="680" y1="662" x2="712" y2="662" stroke="#c41e3a" stroke-width="1.4"/>
      <text x="720" y="666" fill="#5a616b" font-size="12" font-family="'Geist Mono', monospace">MEMORY HIT</text>
    </svg>
  </div>
</body>
</html>
